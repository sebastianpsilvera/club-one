<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>
<header style="position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid #E6EAF1;font-family:Manrope,sans-serif;">
  <div style="max-width:1200px;margin:0 auto;padding:0 24px;height:74px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
    <a href="Inicio.dc.html" style="display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0;">
      <svg width="38" height="38" viewBox="0 0 64 64" fill="none" aria-label="Club One">
        <circle cx="32" cy="32" r="22" fill="none" stroke="#0A1B3D" stroke-width="11" stroke-dasharray="122.8 15.4" stroke-dashoffset="7.7"></circle>
        <path d="M23 27 L39 16 L39 49 L47 49 L47 55 L21 55 L21 49 L31 49 L31 25 Z" fill="#2E7BE8"></path>
      </svg>
      <span style="font-family:Sora,sans-serif;font-weight:800;font-size:21px;letter-spacing:0.04em;color:#0A1B3D;">CLUB <span style="color:#2E7BE8;">ONE</span></span>
    </a>
    <nav style="display:{{ desktopDisplay }};align-items:center;gap:2px;">
      <a href="Inicio.dc.html" style="{{ s.inicio }}">Inicio</a>
      <a href="Producto.dc.html" style="{{ s.producto }}">Producto</a>
      <a href="Nosotros.dc.html" style="{{ s.nosotros }}">Nosotros</a>
      <a href="Clientes.dc.html" style="{{ s.clientes }}">Clientes</a>
      <a href="Contacto.dc.html" style="{{ s.contacto }}">Contacto</a>
    </nav>
    <div style="display:{{ desktopDisplay }};align-items:center;gap:18px;flex-shrink:0;">
      <a href="Contacto.dc.html" style="text-decoration:none;font-size:15px;font-weight:600;color:#0A1B3D;">Acceder</a>
      <a href="Contacto.dc.html" style="text-decoration:none;font-size:15px;font-weight:700;color:#ffffff;background:#2E7BE8;padding:12px 22px;border-radius:10px;box-shadow:0 8px 20px rgba(46,123,232,0.30);" style-hover="background:#1E63C8;">Solicitar demo</a>
    </div>
    <button onClick="{{ toggleMenu }}" aria-label="Menú" style="display:{{ mobileBtnDisplay }};align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #E6EAF1;border-radius:10px;background:#fff;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A1B3D" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
    </button>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid #E6EAF1;background:#fff;padding:10px 24px 22px;display:flex;flex-direction:column;gap:2px;">
      <a href="Inicio.dc.html" style="text-decoration:none;font-size:16px;font-weight:600;color:#0F1B33;padding:13px 8px;border-bottom:1px solid #F0F2F7;">Inicio</a>
      <a href="Producto.dc.html" style="text-decoration:none;font-size:16px;font-weight:600;color:#0F1B33;padding:13px 8px;border-bottom:1px solid #F0F2F7;">Producto</a>
      <a href="Nosotros.dc.html" style="text-decoration:none;font-size:16px;font-weight:600;color:#0F1B33;padding:13px 8px;border-bottom:1px solid #F0F2F7;">Nosotros</a>
      <a href="Clientes.dc.html" style="text-decoration:none;font-size:16px;font-weight:600;color:#0F1B33;padding:13px 8px;border-bottom:1px solid #F0F2F7;">Clientes</a>
      <a href="Contacto.dc.html" style="text-decoration:none;font-size:16px;font-weight:600;color:#0F1B33;padding:13px 8px;">Contacto</a>
      <a href="Contacto.dc.html" style="text-decoration:none;text-align:center;font-size:16px;font-weight:700;color:#fff;background:#2E7BE8;padding:14px;border-radius:10px;margin-top:14px;">Solicitar demo</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:74},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;producto&quot;,&quot;nosotros&quot;,&quot;clientes&quot;,&quot;contacto&quot;],&quot;default&quot;:&quot;inicio&quot;}}">
class Component extends DCLogic {
  state = { isMobile: false, menuOpen: false };
  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 880px)');
    this.update = () => this.setState({ isMobile: this.mq.matches, menuOpen: false });
    this.update();
    this.mq.addEventListener('change', this.update);
  }
  componentWillUnmount() {
    if (this.mq && this.update) this.mq.removeEventListener('change', this.update);
  }
  renderVals() {
    const active = this.props.active || 'inicio';
    const base = "text-decoration:none;font-size:15px;font-weight:600;color:#46566F;padding:9px 15px;border-radius:8px;";
    const act = "text-decoration:none;font-size:15px;font-weight:700;color:#2E7BE8;padding:9px 15px;border-radius:8px;background:#EAF1FC;";
    const mk = k => active === k ? act : base;
    return {
      s: {
        inicio: mk('inicio'), producto: mk('producto'), nosotros: mk('nosotros'),
        clientes: mk('clientes'), contacto: mk('contacto')
      },
      desktopDisplay: this.state.isMobile ? 'none' : 'flex',
      mobileBtnDisplay: this.state.isMobile ? 'flex' : 'none',
      menuOpen: this.state.menuOpen && this.state.isMobile,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
    };
  }
}
</script>
</body>
</html>
